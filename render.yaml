services:
  - type: web
    name: onetop-crm
    runtime: docker
    plan: starter
    region: singapore
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /data
      - key: ADMIN_PASSWORD
        sync: false
    disk:
      name: onetop-data
      mountPath: /data
      sizeGB: 1
